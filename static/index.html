<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SkinNN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #141415;
      --ink-soft: #3a3a3c;
      --muted: #6b6b70;
      --line: #e2e2e6;
      --line-strong: #c8c8ce;
      --surface: #ffffff;
      --surface-soft: #f3f3f5;
      --bg-0: #f7f7f8;
      --bg-1: #ececef;
      --shadow: 0 18px 40px -28px rgba(20, 20, 21, 0.45);
      --radius: 4px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Outfit", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 50% -10%, #ffffff 0%, transparent 55%),
        radial-gradient(90% 60% at 100% 100%, #e8e8ec 0%, transparent 50%),
        linear-gradient(165deg, var(--bg-0), var(--bg-1));
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(560px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 4.5rem 0 3.5rem;
      animation: rise 0.7s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      margin-bottom: 2.75rem;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(2.8rem, 9vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 0.95;
      color: var(--ink);
    }

    .tagline {
      margin: 0.65rem 0 0;
      max-width: 28ch;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.15rem;
      animation: rise 0.9s ease 0.08s both;
    }

    label.file {
      display: grid;
      place-items: center;
      gap: 0.35rem;
      min-height: 168px;
      cursor: pointer;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 1.5rem 1rem;
      text-align: center;
      color: var(--muted);
      background:
        linear-gradient(180deg, var(--surface-soft), #fafafa);
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    label.file:hover {
      border-color: var(--ink);
      background: #f0f0f2;
      transform: translateY(-1px);
    }

    label.file.has-file {
      min-height: auto;
      padding: 0.85rem;
      background: var(--surface);
      border-style: solid;
      border-color: var(--line);
    }

    label.file strong {
      display: block;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    label.file span.hint {
      font-size: 0.9rem;
    }

    input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
    }

    .preview {
      display: none;
      width: 100%;
      max-height: 280px;
      border-radius: 2px;
      object-fit: contain;
      background: var(--surface-soft);
    }

    .actions {
      margin-top: 1rem;
      display: flex;
      gap: 0.85rem;
      align-items: center;
    }

    button {
      appearance: none;
      border: none;
      border-radius: var(--radius);
      padding: 0.78rem 1.35rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
      background: var(--ink);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #2a2a2c;
      transform: translateY(-1px);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: -0.01em;
    }

    #result {
      display: none;
      margin-top: 1.25rem;
      padding: 1.15rem 1.2rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      animation: fade-in 0.35s ease both;
    }

    #result[data-visible="true"] {
      display: block;
    }

    #result .label {
      margin: 0 0 0.35rem;
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .prediction {
      margin: 0;
      font-size: clamp(1.45rem, 4vw, 1.85rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      color: var(--ink);
      line-height: 1.2;
    }

    footer {
      margin-top: 2.75rem;
      padding-top: 1.15rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.55;
      letter-spacing: -0.01em;
      animation: rise 1s ease 0.12s both;
    }

    @media (max-width: 480px) {
      main { width: min(100%, calc(100% - 1.5rem)); padding-top: 3rem; }
      .actions { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <h1>SkinNN</h1>
      <p class="tagline">Upload a dermoscopic lesion photo to see the predicted class.</p>
    </header>

    <div class="panel">
      <label class="file" for="photo" id="dropzone">
        <strong id="drop-title">Choose a photo</strong>
        <span class="hint" id="drop-hint">JPG or PNG works best</span>
        <img id="preview" class="preview" alt="Selected photo preview" />
      </label>
      <input id="photo" type="file" accept="image/*" />
      <div class="actions">
        <button id="analyze" type="button" disabled>Analyze</button>
        <span id="status" class="status"></span>
      </div>
    </div>

    <section id="result" aria-live="polite">
      <p class="label">Predicted</p>
      <p class="prediction" id="prediction"></p>
    </section>

    <footer>
      Prototype / not medical advice. SkinNN is for learning and demos only.
      It does not diagnose cancer or any disease — talk to a clinician about skin concerns.
    </footer>
  </main>

  <script>
    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const dropzone = document.getElementById("dropzone");
    const dropTitle = document.getElementById("drop-title");
    const dropHint = document.getElementById("drop-hint");
    const analyze = document.getElementById("analyze");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const prediction = document.getElementById("prediction");

    let selectedFile = null;
    let previewUrl = null;

    function setResultVisible(visible) {
      result.dataset.visible = visible ? "true" : "false";
      if (!visible) result.style.display = "none";
      else result.style.display = "block";
    }

    function showPreview(file) {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      preview.src = previewUrl;
      preview.style.display = "block";
      dropTitle.style.display = "none";
      dropHint.style.display = "none";
      dropzone.classList.add("has-file");
    }

    function clearPreview() {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
      preview.removeAttribute("src");
      preview.style.display = "none";
      dropTitle.style.display = "";
      dropHint.style.display = "";
      dropzone.classList.remove("has-file");
    }

    photo.addEventListener("change", () => {
      selectedFile = photo.files[0] || null;
      analyze.disabled = !selectedFile;
      status.textContent = "";
      setResultVisible(false);

      if (!selectedFile) {
        clearPreview();
        return;
      }

      showPreview(selectedFile);
    });

    analyze.addEventListener("click", async () => {
      if (!selectedFile) return;

      analyze.disabled = true;
      status.textContent = "Analyzing…";
      setResultVisible(false);

      const body = new FormData();
      body.append("file", selectedFile);

      try {
        const res = await fetch("/predict", { method: "POST", body });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.detail || "Prediction failed");
        }

        prediction.textContent = data.class;
        setResultVisible(true);
        status.textContent = "Done";
      } catch (err) {
        status.textContent = err.message || "Something went wrong";
      } finally {
        analyze.disabled = !selectedFile;
      }
    });
  </script>
</body>
</html>
